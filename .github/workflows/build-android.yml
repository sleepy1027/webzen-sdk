name: Build Android AAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-aar:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Build WebzenSDK.aar
        run: ./scripts/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WebzenSDK-android
          path: bridge/unreal/ThirdParty/WebzenCore/Android/WebzenSDK.aar
